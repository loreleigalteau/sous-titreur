[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sous-titreur"
version = "0.1.0"
description = "Free, local-first subtitle generator and editor"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0",
    "numpy",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx",  # used by FastAPI's TestClient
]

[project.scripts]
sous-titreur = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# The web interface, built by `npm run build` in frontend/.
app = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
